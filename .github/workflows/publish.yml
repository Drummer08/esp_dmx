name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add targets
        run: rustup target add riscv32imc-unknown-none-elf riscv32imac-unknown-none-elf

      - name: Tag must match the version in Cargo.toml
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Check ESP32-C3
        run: cargo check --features esp32c3,unstable --target riscv32imc-unknown-none-elf

      - name: Check ESP32-C3
        run: cargo check --features esp32c3,unstable,async --target riscv32imc-unknown-none-elf

      - name: Check ESP32-C6
        run: cargo check --features esp32c6,unstable --target riscv32imac-unknown-none-elf

      - name: Check ESP32-C6 with async
        run: cargo check --features esp32c6,unstable,async --target riscv32imac-unknown-none-elf

      - name: Publish
        run: cargo publish --features esp32c6,unstable,async --target riscv32imac-unknown-none-elf
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}
